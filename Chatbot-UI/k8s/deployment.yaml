apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: chatbot
        image: 574921529429.dkr.ecr.eu-north-1.amazonaws.com/openai-chatbot:v1
        ports:
        - containerPort: 3000
        env:
        - name: ALLOW_SERVER_OPENAI_API_KEY
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        readinessProbe:
          httpGet:  
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
          

